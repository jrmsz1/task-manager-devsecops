# ═══════════════════════════════════════════════════════════════════════════
# Fail2ban — Proteção contra força bruta no Task Manager
#
# Instalação no servidor (staging ou prod):
#   sudo apt-get install -y fail2ban
#   sudo cp monitoring/fail2ban-filter.conf  /etc/fail2ban/filter.d/task-manager.conf
#   sudo cp monitoring/fail2ban-jail.conf    /etc/fail2ban/jail.d/task-manager.conf
#   sudo systemctl restart fail2ban
#
# Verificar status:
#   sudo fail2ban-client status task-manager
#
# O padrão AUTH_FAILURE é gerado pelo routes.py:
#   logger.warning("AUTH_FAILURE user=%s ip=%s", ...)
# ═══════════════════════════════════════════════════════════════════════════

# ── FILTRO: /etc/fail2ban/filter.d/task-manager.conf ──────────────────────
# [Definition]
# failregex = ^.*task-manager WARNING.*AUTH_FAILURE.*ip=<HOST>.*$
# ignoreregex =

# ── JAIL: /etc/fail2ban/jail.d/task-manager.conf ──────────────────────────
# [task-manager]
# enabled   = true
# port      = 5000,5001
# filter    = task-manager
# logpath   = /var/log/syslog
#
# # Bloqueia após 5 falhas em 10 min por 1 hora
# maxretry  = 5
# findtime  = 600
# bantime   = 3600
